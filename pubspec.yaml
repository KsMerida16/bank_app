name: bank_app
description: "Bam Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  intl: any
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.4
  riverpod: ^3.2.1
  get_it: ^9.2.1 
  json_annotation: ^4.11.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  freezed: ^3.2.5
  build_runner: ^2.14.1
  json_serializable: ^6.13.1


flutter:
  uses-material-design: true
  generate: true
  assets:
  - assets/
  - assets/logo_light.png
  - assets/logo_dark.png
  - env_dev.json
  - env_prod.json