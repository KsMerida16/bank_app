name: CI

on:
  push:
    branches: [master, main, "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Los archivos generados (freezed / json_serializable / l10n) están
      # versionados en el repo, por eso no se regeneran en CI.

      - name: Check formatting (informativo)
        # TODO: quitar continue-on-error cuando todo el repo esté formateado.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis (falla solo con errores)
        # TODO: endurecer a `flutter analyze` completo al limpiar warnings.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  build-apk:
    name: Build APK (dev)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK (entorno dev)
        run: flutter build apk --debug -t lib/main_dev.dart

      - uses: actions/upload-artifact@v4
        with:
          name: bank-app-dev-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
